version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dailyworks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: 
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/dailyworks
      - SECRET_KEY=supersecretkey
      - EMAIL_PROVIDER=console
    depends_on:
      - db

  worker:
    build: 
      context: .
      dockerfile: ./worker/Dockerfile
    command: python worker/main.py
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/dailyworks
      - EMAIL_PROVIDER=console
    depends_on:
      - db
      - api

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
